[package]
name = "lumen-launcher"
version = "0.1.0"
description = "Lumen launcher: prepares the shader cache, then starts the game"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["custom-protocol"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
rfd = "0.15"

# The launcher does little work of its own: build it quickly rather than tightly.
[profile.release]
opt-level = 1
codegen-units = 16
debug = false
strip = true

# Stands alone: not a member of the layer's workspace.
[workspace]
